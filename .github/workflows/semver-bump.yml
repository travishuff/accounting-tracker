name: Semver Bump

on:
  pull_request:
    branches: [master]
    types: [closed]

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Determine bump
        id: bump
        run: |
          labels=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | tr '\n' ' ')
          bump="patch"
          if echo "$labels" | grep -q "semver:major"; then
            bump="major"
          elif echo "$labels" | grep -q "semver:minor"; then
            bump="minor"
          elif echo "$labels" | grep -q "semver:patch"; then
            bump="patch"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Bump version files
        id: version
        run: |
          new_version=$(bun - <<'BUN'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const bump = process.env.BUMP
          const [major, minor, patch] = pkg.version.split('.').map(Number)
          let next = [major, minor, patch]
          if (bump === 'major') next = [major + 1, 0, 0]
          if (bump === 'minor') next = [major, minor + 1, 0]
          if (bump === 'patch') next = [major, minor, patch + 1]
          process.stdout.write(next.join('.'))
          BUN
          )
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          bun -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')" "$new_version"
          bun install --lockfile-only
        env:
          BUMP: ${{ steps.bump.outputs.bump }}

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
          git push
